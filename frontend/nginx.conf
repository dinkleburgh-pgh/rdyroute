# nginx config for the ReadyRoute V2 frontend container.
# Serves the Vite build output and proxies /api/* to the backend service.

# Docker's internal DNS resolver — ipv6=off forces IPv4-only resolution,
# preventing nginx from trying the container's IPv6 address (which Docker
# assigns but is unreachable) and causing spurious upstream errors.
resolver 127.0.0.11 ipv6=off valid=10s;

# The scheme the CLIENT actually used. TLS terminates upstream (Cloudflare, or
# lanproxy on the LAN path), so $scheme is plain http by the time the request
# reaches this container — passing it through as X-Forwarded-Proto told the
# backend every request was insecure and suppressed HSTS entirely. Trust the
# upstream proxy's header when it sends one, and fall back to our own scheme
# for direct hits (LAN dev straight at the container).
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Empty unless the client is on https — nginx skips an add_header whose value
# resolves to an empty string, which keeps plaintext dev from being pinned.
map $client_proto $hsts_value {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

upstream readyroute_backend {
    # 'backend' is the service name from docker-compose.yml
    server backend:8000;
    # Reuse TCP connections to the backend (avoids reconnect overhead per request)
    keepalive 32;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Reasonable defaults
    sendfile        on;
    tcp_nopush      on;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml text/xml image/svg+xml font/woff2;
    client_max_body_size 50m;

    # API proxy — strip the /api prefix to match FastAPI routes.
    # NOTE: Do NOT set Upgrade/Connection headers here; those are WebSocket-only
    #       and break HTTP/1.1 keepalive to the upstream when set on REST traffic.
    location /api/ {
        proxy_pass         http://readyroute_backend/;
        proxy_http_version 1.1;
        # Empty Connection header enables keepalive to the upstream pool
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        proxy_read_timeout 60s;
        # Never serve stale API responses from nginx's own cache
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # WebSocket proxy — forward /ws directly to the backend.
    # Upgrade/Connection headers are required here to negotiate the WS handshake.
    location /ws {
        proxy_pass         http://readyroute_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $client_proto;
        # Disable buffering — WebSocket frames must be forwarded immediately
        proxy_buffering    off;
        # Long timeout: WebSocket connections are long-lived (idle keepalive pings)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: serve index.html for any unknown route.
    # The include is repeated per-location on purpose — see the comment in
    # nginx-security-headers.inc. It is deliberately absent from /api/ and /ws,
    # which are proxied: FastAPI already sets these on its own responses, and
    # add_header appends rather than replaces, so including it there would emit
    # each header twice (a duplicated X-Frame-Options is treated as invalid).
    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # PWA update surface — must ALWAYS revalidate so new deploys propagate.
    # Cloudflare sits in front; without an explicit no-cache it edge-caches
    # sw.js under the zone's Browser Cache TTL (seen: max-age=14400), so the
    # service worker never sees the new version and clients stay stuck on a
    # stale build. The hashed /assets/ below stay immutable; only these mutable
    # entry files get no-cache.
    # `location /` try_files internally redirects the SPA document here, so this
    # block — not `location /` — is what actually serves the main HTML page.
    location = /index.html            { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; }
    location = /sw.js                 { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js         { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest  { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /build-info.json       { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Long cache for hashed static assets emitted by Vite.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
