# Security headers for browser-facing responses from the frontend container.
#
# This is an INCLUDE rather than a single server-level block because nginx's
# add_header does not merge across configuration levels: a location that
# defines any add_header of its own silently drops every header inherited from
# the server block. The PWA entry files and /assets/ all set their own
# Cache-Control, and the SPA document is served through `location = /index.html`
# (try_files internally redirects there) — so without including this in each of
# them, the main HTML page, the one response that actually matters for
# clickjacking and CSP, would ship with no protection at all.
#
# The backend sets equivalent headers on /api/* responses; these cover the
# static document and assets that nginx serves directly and FastAPI never sees.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "DENY"                            always;
# frame-ancestors is the high-value directive here and is safe to apply blind.
# A full script/style CSP is deliberately NOT set: the Vite build's inline boot
# script and the injected service worker would need hashing or a nonce, and a
# wrong policy breaks the whole app rather than degrading.
add_header Content-Security-Policy    "frame-ancestors 'none'"          always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
# $hsts_value is empty unless the CLIENT reached us over https (see the map in
# nginx.conf). nginx omits an add_header whose value is the empty string, so
# plaintext LAN dev never gets pinned to https in the browser.
add_header Strict-Transport-Security  $hsts_value                       always;
